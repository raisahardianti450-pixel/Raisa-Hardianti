<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Game Ular</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
    background: linear-gradient(160deg, #0f2027, #203a43, #2c5364);
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    user-select: none;
  }
  h1 { margin: 0; font-size: 1.8rem; letter-spacing: 1px; }
  .skor { display: flex; gap: 12px; }
  .skor div {
    background: rgba(255,255,255,.12);
    padding: 8px 18px;
    border-radius: 12px;
    font-size: 1rem;
    min-width: 110px;
    text-align: center;
  }
  .skor b { font-size: 1.3rem; display: block; color: #ffd54f; }
  .papan { position: relative; width: min(92vw, 400px); }
  canvas {
    width: 100%;
    height: auto;
    display: block;
    background: #12232b;
    border-radius: 14px;
    border: 3px solid #4fc3a1;
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  .layar {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(10, 20, 26, .82);
    border-radius: 14px;
    text-align: center;
    padding: 20px;
  }
  .layar.sembunyi { display: none; }
  .layar h2 { margin: 0; font-size: 1.6rem; }
  .layar p { margin: 0; opacity: .85; font-size: .95rem; }
  button {
    font: inherit;
    font-weight: 700;
    border: 0;
    border-radius: 12px;
    padding: 12px 28px;
    background: #4fc3a1;
    color: #072a20;
    cursor: pointer;
    transition: transform .1s, background .2s;
  }
  button:hover { background: #6be0bd; }
  button:active { transform: scale(.95); }
  .pad {
    display: grid;
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(2, 64px);
    gap: 8px;
  }
  .pad button {
    padding: 0;
    font-size: 1.6rem;
    background: rgba(255,255,255,.15);
    color: #fff;
  }
  .pad button:active { background: #4fc3a1; color: #072a20; }
  .atas { grid-column: 2; grid-row: 1; }
  .kiri { grid-column: 1; grid-row: 2; }
  .bawah { grid-column: 2; grid-row: 2; }
  .kanan { grid-column: 3; grid-row: 2; }
  .petunjuk { font-size: .85rem; opacity: .7; text-align: center; margin: 0; }
</style>
</head>
<body>
  <h1>🐍 Game Ular</h1>

  <div class="skor">
    <div>Skor<b id="skor">0</b></div>
    <div>Rekor<b id="rekor">0</b></div>
  </div>

  <div class="papan">
    <canvas id="kanvas" width="400" height="400"></canvas>
    <div class="layar" id="layar">
      <h2 id="judul">Siap Main?</h2>
      <p id="pesan">Makan apel merah, jangan tabrak dinding atau badanmu sendiri!</p>
      <button id="tombolMain">Mulai Main</button>
    </div>
  </div>

  <div class="pad">
    <button class="atas" data-arah="atas" aria-label="Atas">▲</button>
    <button class="kiri" data-arah="kiri" aria-label="Kiri">◀</button>
    <button class="bawah" data-arah="bawah" aria-label="Bawah">▼</button>
    <button class="kanan" data-arah="kanan" aria-label="Kanan">▶</button>
  </div>

  <p class="petunjuk">Gunakan tombol panah / WASD, geser layar, atau tombol di atas.</p>

<script>
(function () {
  var kanvas = document.getElementById("kanvas");
  var ctx = kanvas.getContext("2d");
  var elSkor = document.getElementById("skor");
  var elRekor = document.getElementById("rekor");
  var layar = document.getElementById("layar");
  var judul = document.getElementById("judul");
  var pesan = document.getElementById("pesan");
  var tombolMain = document.getElementById("tombolMain");

  var KOTAK = 20;
  var UKURAN = kanvas.width / KOTAK;

  var ular, arah, arahBerikut, apel, skor, rekor, jalan, timer, kecepatan;

  var ARAH = {
    atas:  { x: 0, y: -1 },
    bawah: { x: 0, y: 1 },
    kiri:  { x: -1, y: 0 },
    kanan: { x: 1, y: 0 }
  };

  // Rekor tersimpan di browser (kalau diizinkan)
  rekor = 0;
  try { rekor = parseInt(localStorage.getItem("rekorUlar"), 10) || 0; } catch (e) {}
  elRekor.textContent = rekor;

  function mulai() {
    ular = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    arah = ARAH.kanan;
    arahBerikut = ARAH.kanan;
    skor = 0;
    kecepatan = 140;
    elSkor.textContent = 0;
    letakkanApel();
    layar.classList.add("sembunyi");
    jalan = true;
    clearTimeout(timer);
    gambar();
    timer = setTimeout(langkah, kecepatan);
  }

  function letakkanApel() {
    var ok = false;
    while (!ok) {
      apel = {
        x: Math.floor(Math.random() * KOTAK),
        y: Math.floor(Math.random() * KOTAK)
      };
      ok = !ular.some(function (s) { return s.x === apel.x && s.y === apel.y; });
    }
  }

  function langkah() {
    if (!jalan) return;
    arah = arahBerikut;
    var kepala = { x: ular[0].x + arah.x, y: ular[0].y + arah.y };

    var nabrakDinding = kepala.x < 0 || kepala.y < 0 || kepala.x >= KOTAK || kepala.y >= KOTAK;
    var nabrakBadan = ular.some(function (s) { return s.x === kepala.x && s.y === kepala.y; });
    if (nabrakDinding || nabrakBadan) { selesai(); return; }

    ular.unshift(kepala);
    if (kepala.x === apel.x && kepala.y === apel.y) {
      skor += 10;
      elSkor.textContent = skor;
      if (kecepatan > 70) kecepatan -= 3;
      letakkanApel();
    } else {
      ular.pop();
    }
    gambar();
    timer = setTimeout(langkah, kecepatan);
  }

  function selesai() {
    jalan = false;
    if (skor > rekor) {
      rekor = skor;
      elRekor.textContent = rekor;
      try { localStorage.setItem("rekorUlar", String(rekor)); } catch (e) {}
      judul.textContent = "Rekor Baru! 🎉";
    } else {
      judul.textContent = "Game Selesai 💥";
    }
    pesan.textContent = "Skor kamu: " + skor;
    tombolMain.textContent = "Main Lagi";
    layar.classList.remove("sembunyi");
  }

  function gambar() {
    ctx.fillStyle = "#12232b";
    ctx.fillRect(0, 0, kanvas.width, kanvas.height);

    // pola kotak halus
    ctx.fillStyle = "rgba(255,255,255,.03)";
    for (var i = 0; i < KOTAK; i++) {
      for (var j = 0; j < KOTAK; j++) {
        if ((i + j) % 2 === 0) ctx.fillRect(i * UKURAN, j * UKURAN, UKURAN, UKURAN);
      }
    }

    // apel
    ctx.fillStyle = "#ff5252";
    ctx.beginPath();
    ctx.arc(apel.x * UKURAN + UKURAN / 2, apel.y * UKURAN + UKURAN / 2, UKURAN / 2 - 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#66bb6a";
    ctx.fillRect(apel.x * UKURAN + UKURAN / 2 - 1, apel.y * UKURAN + 1, 3, 5);

    // ular
    ular.forEach(function (s, i) {
      ctx.fillStyle = i === 0 ? "#b9f6ca" : "#4fc3a1";
      var r = 5;
      var x = s.x * UKURAN + 1, y = s.y * UKURAN + 1, w = UKURAN - 2;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + w, r);
      ctx.arcTo(x + w, y + w, x, y + w, r);
      ctx.arcTo(x, y + w, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.fill();
    });

    // mata
    var k = ular[0];
    ctx.fillStyle = "#0b1a20";
    ctx.beginPath();
    ctx.arc(k.x * UKURAN + 6, k.y * UKURAN + 7, 2, 0, Math.PI * 2);
    ctx.arc(k.x * UKURAN + 14, k.y * UKURAN + 7, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function ubahArah(nama) {
    var baru = ARAH[nama];
    if (!baru || !jalan) return;
    // tidak boleh langsung berbalik arah
    if (baru.x === -arah.x && baru.y === -arah.y) return;
    arahBerikut = baru;
  }

  // Keyboard
  document.addEventListener("keydown", function (e) {
    var peta = {
      ArrowUp: "atas", ArrowDown: "bawah", ArrowLeft: "kiri", ArrowRight: "kanan",
      w: "atas", s: "bawah", a: "kiri", d: "kanan",
      W: "atas", S: "bawah", A: "kiri", D: "kanan"
    };
    if (peta[e.key]) {
      e.preventDefault();
      ubahArah(peta[e.key]);
    } else if ((e.key === " " || e.key === "Enter") && !jalan) {
      e.preventDefault();
      mulai();
    }
  });

  // Tombol di layar
  document.querySelectorAll(".pad button").forEach(function (b) {
    var tekan = function (e) { e.preventDefault(); ubahArah(b.dataset.arah); };
    b.addEventListener("touchstart", tekan, { passive: false });
    b.addEventListener("mousedown", tekan);
  });

  // Geser layar (swipe)
  var sx = 0, sy = 0;
  document.addEventListener("touchstart", function (e) {
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
    if (Math.abs(dx) > Math.abs(dy)) ubahArah(dx > 0 ? "kanan" : "kiri");
    else ubahArah(dy > 0 ? "bawah" : "atas");
  }, { passive: true });

  tombolMain.addEventListener("click", mulai);

  // Tampilan awal
  ular = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  arah = ARAH.kanan;
  apel = { x: 15, y: 10 };
  jalan = false;
  gambar();
})();
</script>
</body>
</html>
